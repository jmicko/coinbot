services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: coinbot-postgres
    environment:
      POSTGRES_USER: coinbot
      POSTGRES_PASSWORD: coinbot
      POSTGRES_DB: coinbot_dev
    ports:
      - "5432:5432"
    volumes:
      - coinbot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinbot -d coinbot_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  coinbot-postgres-data:
